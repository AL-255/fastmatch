name: Desktop release builds
on:
  workflow_dispatch:
  push:
    tags: ['v*-desktop*']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.backend }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, platform: windows-x64, backend: cpu, python: '3.13'}
          - {os: windows-2025, platform: windows-x64, backend: rocm7.2.1-bundled, python: '3.12'}
          - {os: macos-15, platform: macos-arm64, backend: mps, python: '3.13'}
          - {os: macos-15-intel, platform: macos-x64, backend: cpu, python: '3.12'}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install Windows ROCm runtime
        if: matrix.backend == 'rocm7.2.1-bundled'
        run: python -m pip install --no-cache-dir -r requirements-rocm-windows.txt
      - name: Install CPU runtime
        if: matrix.backend == 'cpu' && matrix.platform != 'macos-x64'
        run: python -m pip install --no-cache-dir torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Apple Silicon runtime
        if: matrix.backend == 'mps'
        run: python -m pip install --no-cache-dir torch==2.11.0
      - name: Install build dependencies
        if: matrix.platform != 'macos-x64'
        run: python -m pip install --no-cache-dir -r requirements-build.txt
      - name: Install Intel Mac dependencies
        if: matrix.platform == 'macos-x64'
        run: python -m pip install --no-cache-dir -r packaging/requirements-build-intel.txt
      - name: Download offline semantic model
        run: python -m fastmatch --download-semantic-model
      - name: Test source including transparent image loading
        env:
          HF_HUB_OFFLINE: '1'
          FASTMATCH_TEST_SEMANTIC_MODEL: '1'
        run: python -m pytest -q -rs
      - name: Build and smoke-test native application
        env:
          BUILD_REF: ${{ github.ref_name }}
          BACKEND: ${{ matrix.backend }}
        run: |
          label="dev-${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then label="$BUILD_REF"; fi
          python scripts/build_release.py --label "$label" --backend "$BACKEND"
      - name: Upload validated package and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: FastMatch-${{ matrix.platform }}-${{ matrix.backend }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-${{ matrix.platform }}-${{ matrix.backend }}
          path: |
            build/*.json
            build/metadata/*.json
            build/FastMatch/warn-FastMatch.txt
          if-no-files-found: ignore
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish all four validated desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_release.py --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --run-id "$GITHUB_RUN_ID" --desktop
